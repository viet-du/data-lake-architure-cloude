version: "3.8"


services:
  minio:
    image: minio/minio:latest
    container_name: lake-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: lake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/bronze --ignore-existing;
      mc mb -p local/silver --ignore-existing;
      mc mb -p local/gold --ignore-existing;
      mc mb -p local/bronze/clickstream --ignore-existing;
      mc mb -p local/silver/clickstream --ignore-existing;
      mc mb -p local/gold/clickstream --ignore-existing;
      mc mb -p local/bronze/ecommerce --ignore-existing;
      mc mb -p local/silver/ecommerce --ignore-existing;
      mc mb -p local/gold/ecommerce --ignore-existing;
      mc anonymous set none local/bronze;
      mc anonymous set none local/silver;
      mc anonymous set none local/gold;
      echo ' MinIO buckets created: bronze, silver, gold';
      mc ls local/;
      "

  postgres:
    image: postgres:13
    container_name: lake-postgres
    environment:
      POSTGRES_DB: hive_metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: lake-hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.net.ssl.trustStorePassword changeit -Dsun.net.inetaddr.ttl=60"
    ports:
      - "9083:9083"
    volumes:
      - ./configs/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    command: /opt/hive/bin/hive --service metastore

  spark-master:
    image: bitnami/spark:3.4
    container_name: lake-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_JAVA_OPTS: "-Dspark.deploy.mode=cluster"
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"   # Spark master
      - "4040:4040"   # Spark app UI
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
      - ./configs/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
    environment:
      PYTHONPATH: /app-src/src

  spark-worker:
    image: bitnami/spark:3.4
    container_name: lake-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
    environment:
      PYTHONPATH: /app-src/src

  airflow-db:
    image: postgres:13
    container_name: lake-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.7.0-python3.11
    container_name: lake-airflow-webserver
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: "W7LcX4pJ9z8V0qK1yN6mE3hG5sF2bA0dR9tQ8uX7vP="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    ports:
      - "8088:8080"
    volumes:
      - ./airflow_dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/app/src:ro
      - ./airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true;
      airflow webserver
      "

  airflow-scheduler:
    image: apache/airflow:2.7.0-python3.11
    container_name: lake-airflow-scheduler
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: "W7LcX4pJ9z8V0qK1yN6mE3hG5sF2bA0dR9tQ8uX7vP="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow_dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/app/src:ro
      - ./airflow_logs:/opt/airflow/logs
    command: airflow scheduler

  metabase:
    image: metabase/metabase:latest
    container_name: lake-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    container_name: lake-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --kafka-api-addr=0.0.0.0:9092
    ports:
      - "9092:9092"     # Kafka API
      - "8082:8082"     # Pandaproxy (REST)
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: lake-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONFIG_FILEPATH: /etc/console/configs/console.yaml
    ports:
      - "8081:8080"   # Web UI
    volumes:
      - ./configs/redpanda-console.yaml:/etc/console/configs/console.yaml:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lake-kafka-ui
    depends_on:
      - redpanda
    environment:
      KAFKA_CLUSTERS_0_NAME: redpanda-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    ports:
      - "8089:8080"   # Web UI

  mongo:
    image: mongo:7
    container_name: lake-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongoadmin
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lake-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: lake-api
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      ENV: local
      LOG_LEVEL: info
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      MONGO_URI: mongodb://mongoadmin:mongoadmin@mongo:27017
      MONGO_DB: lakehouse_catalog
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AIRFLOW_BASE_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
      DUCKDB_MEMORY_LIMIT: 4GB
      DUCKDB_THREADS: "4"
      API_PORT: "3001"
      API_RATE_LIMIT_PER_MIN: "600"
      API_CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
      API_SWAGGER_ENABLED: "true"
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  minio_data:
  postgres_data:
  airflow_db_data:
  metabase_data:
  redpanda_data:
  mongo_data:
  redis_data:
