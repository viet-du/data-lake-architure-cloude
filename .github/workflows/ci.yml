name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests

      - name: Format check (black)
        run: .venv/bin/black --check src tests

      - name: Type check (mypy)
        run: .venv/bin/mypy src

      - name: Test
        run: .venv/bin/pytest tests/ --no-cov -q

  node-web:
    name: Web (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Unit and contract tests
        run: pnpm test

      - name: Build
        run: pnpm build

  node-api:
    name: API (typecheck + contracts + build)
    runs-on: ubuntu-latest
    env:
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: ci-test-only
      MINIO_SECRET_KEY: ci-test-only
      KAFKA_BOOTSTRAP: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter lakehouse-api typecheck
      - name: Unit and contract tests
        run: pnpm --filter lakehouse-api test
      - name: Build
        run: pnpm --filter lakehouse-api build

  docker-compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          export AIRFLOW_FERNET_KEY="$(python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          docker compose -f docker-compose.yml -f docker-compose-kafka.yml config --quiet
