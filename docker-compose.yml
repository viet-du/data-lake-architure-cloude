
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lake-minio
    user: "0:0"   # Chainguard image defaults to nonroot (uid 65532); run as root so it can write /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      # Chainguard minio image is minimal (no curl/wget/grep). Use TCP-only check.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo PING >&3 && head -c 1 <&3 && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: lake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/bronze --ignore-existing;
      mc mb -p local/silver --ignore-existing;
      mc mb -p local/gold --ignore-existing;
      mc mb -p local/bronze/clickstream --ignore-existing;
      mc mb -p local/silver/clickstream --ignore-existing;
      mc mb -p local/gold/clickstream --ignore-existing;
      mc mb -p local/bronze/ecommerce --ignore-existing;
      mc mb -p local/silver/ecommerce --ignore-existing;
      mc mb -p local/gold/ecommerce --ignore-existing;
      mc anonymous set none local/bronze;
      mc anonymous set none local/silver;
      mc anonymous set none local/gold;
      echo ' MinIO buckets created: bronze, silver, gold';
      mc ls local/;
      "

  postgres:
    image: postgres:13
    container_name: lake-postgres
    environment:
      POSTGRES_DB: hive_metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: lake-hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # Apache hive 3.1.3 entrypoint parses SERVICE_OPTS; pass each JVM arg as a single token
      SERVICE_OPTS: >-
        -Djavax.net.ssl.trustStorePassword=changeit
        -Dsun.net.inetaddr.ttl=60
        -Xmx1G
    ports:
      - "9083:9083"
    volumes:
      - ./configs/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    command: /opt/hive/bin/hive --service metastore
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':9083' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  spark-master:
    image: bitnamilegacy/spark:3.5.6-debian-12-r1
    container_name: lake-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_JAVA_OPTS: "-Dspark.deploy.mode=cluster"
      PYTHONPATH: /app-src/src
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"   # Spark master
      - "4040:4040"   # Spark app UI
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
      - ./configs/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  spark-worker:
    image: bitnamilegacy/spark:3.5.6-debian-12-r1
    container_name: lake-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      PYTHONPATH: /app-src/src
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://spark-master:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-db:
    image: postgres:13
    container_name: lake-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.7.0-python3.11
    container_name: lake-airflow-webserver
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: "W7LcX4pJ9z8V0qK1yN6mE3hG5sF2bA0dR9tQ8uX7vP="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      PYTHONPATH: /app-src/src
    ports:
      - "8088:8080"  # Airflow webserver (host 8088 → container 8080, avoids Spark UI collision on 8080)
    volumes:
      - ./airflow_dags:/opt/airflow/dags:ro
      - ./src:/app-src/src:ro
      # Mount source at /app-src/src so DAGs referencing /app-src/lakehouse/... resolve correctly
      - ./src:/app-src/src:ro
      - ./airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true;
      airflow webserver
      "

  airflow-scheduler:
    image: apache/airflow:2.7.0-python3.11
    container_name: lake-airflow-scheduler
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: "W7LcX4pJ9z8V0qK1yN6mE3hG5sF2bA0dR9tQ8uX7vP="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /app-src/src
    volumes:
      - ./airflow_dags:/opt/airflow/dags:ro
      # Mount source at /app-src/src so DAGs referencing /app-src/lakehouse/... resolve correctly
      - ./src:/app-src/src:ro
      - ./airflow_logs:/opt/airflow/logs
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:admin http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  metabase:
    image: metabase/metabase:latest
    container_name: lake-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    container_name: lake-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9192
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9192
      - --pandaproxy-addr=0.0.0.0:8282
      - --advertise-pandaproxy-addr=redpanda:8282
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9192:9192"     # Kafka API
      - "8282:8282"     # Pandaproxy (REST)
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: lake-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9192
      CONFIG_FILEPATH: /etc/console/configs/console.yaml
    ports:
      - "8091:8080"   # Web UI (8081 conflicts with kafka-ui in compose-kafka)
    volumes:
      - ./configs/redpanda-console.yaml:/etc/console/configs/console.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lake-kafka-ui
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: redpanda-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9192
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    ports:
      - "8089:8080"   # Web UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongo:
    image: mongo:7
    container_name: lake-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongoadmin
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lake-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Note: api & web services are defined in docker-compose.api.yml
  # Run together: docker compose -f docker-compose.yml -f docker-compose-kafka.yml -f docker-compose.api.yml up -d

volumes:
  minio_data:
  postgres_data:
  airflow_db_data:
  metabase_data:
  redpanda_data:
  mongo_data:
  redis_data:
