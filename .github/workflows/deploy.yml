name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: |
          cd apps/web
          npm install --no-audit --no-fund --legacy-peer-deps
          echo "=== Checking vite ==="
          ls node_modules/.bin/ | grep -i vite || echo "NO vite in .bin"
          ls node_modules/vite/bin/ 2>&1 || echo "NO vite module"

      - name: Build web app
        run: |
          cd apps/web
          npx vite build
          ls -la dist/

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name=data-lake-architecture-cloude --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
