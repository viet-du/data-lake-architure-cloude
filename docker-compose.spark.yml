# ============================================================================
# docker-compose.spark.yml
# ----------------------------------------------------------------------------
# Override: replace Bitnami Spark (ARM64 emulation issues) with apache/spark:3.5.0
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose-kafka.yml -f docker-compose.spark.yml up -d
# ============================================================================

services:
  spark-master:
    # lake-spark:3.5.0 - custom build with lakehouse Python deps
    # (built from apache/spark:3.5.0 which has native ARM64 support)
    image: lake-spark:3.5.0
    container_name: lake-spark-master
    user: root
    working_dir: /opt/spark
    # Override entrypoint to start master daemon
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /tmp/.ivy2 /tmp/spark-events /tmp/spark-work
        export HOME=/tmp
        export SPARK_MASTER_HOST=spark-master
        export SPARK_MASTER_PORT=7077
        export SPARK_MASTER_WEBUI_PORT=8080
        export PYSPARK_PYTHON=python3
        export PYTHONPATH=/app-src/src:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
        # Start master
        sbin/start-master.sh
        # Tail logs (keep container alive)
        tail -F /opt/spark/logs/spark-*-*-*.out
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
      - ./configs/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_ivy_cache:/tmp/.ivy2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  spark-worker:
    image: lake-spark:3.5.0
    container_name: lake-spark-worker
    user: root
    working_dir: /opt/spark
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /tmp/.ivy2 /tmp/spark-work
        export HOME=/tmp
        export SPARK_MASTER_URL=spark://spark-master:7077
        export SPARK_WORKER_MEMORY=2g
        export SPARK_WORKER_CORES=2
        export PYSPARK_PYTHON=python3
        export PYTHONPATH=/app-src/src:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
        sbin/start-worker.sh spark://spark-master:7077
        tail -F /opt/spark/logs/spark-*-*-*.out
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
      - spark_ivy_cache:/tmp/.ivy2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://spark-master:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  spark_ivy_cache:
