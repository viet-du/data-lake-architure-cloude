name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: |
          cd apps/web
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps
          echo "=== Verifying install ==="
          test -f node_modules/tailwindcss/package.json && echo "tailwindcss OK" || echo "FAIL: tailwindcss missing"
          test -f node_modules/vite/package.json && echo "vite OK" || echo "FAIL: vite missing"
          test -f node_modules/.bin/vite && echo "vite bin OK" || echo "FAIL: vite bin missing"

      - name: Build web app
        run: |
          cd apps/web
          npx vite build
          ls -la dist/

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name=data-lake-architecture-cloude --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
