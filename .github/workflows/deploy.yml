name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: |
          # Force remove any leftover node_modules from previous runs
          rm -rf /home/runner/work/data-lake-architure-cloude/data-lake-architure-cloude/node_modules
          rm -rf /home/runner/work/data-lake-architure-cloude/data-lake-architure-cloude/apps/web/node_modules
          rm -rf /home/runner/work/data-lake-architure-cloude/data-lake-architure-cloude/apps/web/package-lock.json
          # Verify the postcss config in apps/web is using local node_modules
          cd apps/web
          npm install --no-audit --no-fund --legacy-peer-deps
          echo "=== Verifying install ==="
          ls node_modules/tailwindcss/package.json && echo "tailwindcss OK"
          ls node_modules/vite/package.json && echo "vite OK"
          ls node_modules/.bin/vite && echo "vite bin OK"

      - name: Build web app
        run: |
          cd apps/web
          npx vite build
          ls -la dist/

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name=data-lake-architecture-cloude --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
