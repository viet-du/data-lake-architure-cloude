services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: lake-api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      REDIS_HOST: redis
    depends_on:
      - mongo
      - redis
      - minio
      - redpanda
      - airflow-webserver
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lake-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    depends_on:
      - api
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: lake-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lake-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data: