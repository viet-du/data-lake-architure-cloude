
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lake-minio
    user: "0:0"   # Chainguard image defaults to nonroot (uid 65532); run as root so it can write /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      # Chainguard minio image is minimal (no curl/wget/grep). Use TCP-only check.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo PING >&3 && head -c 1 <&3 && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: lake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # NOTE: keep $b and $sub out of reach of Compose's own variable
    # interpolation — use $${b} / $${sub} so they are expanded by `sh -c`
    # at run time, not by the host shell at compose time.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        mc alias set local http://minio:9000 minioadmin minioadmin
        for b in bronze silver gold; do
          mc mb --ignore-existing "local/$${b}" || true
        done
        for sub in crm erp; do
          for layer in bronze silver gold; do
            mc mb --ignore-existing "local/$${layer}/$${sub}" || true
          done
        done
        for ns in clickstream ecommerce; do
          for layer in bronze silver gold; do
            mc mb --ignore-existing "local/$${layer}/$${ns}" || true
          done
        done
        echo ' MinIO buckets created:'
        mc ls local/

  postgres:
    image: postgres:13
    container_name: lake-postgres
    environment:
      POSTGRES_DB: hive_metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hive Metastore (apache/hive:3.1.3) was removed in PHASE 2.
  # Delta Lake uses its own _delta_log/ transaction log for the catalog,
  # and no code path in src/lakehouse/ queries the metastore. The previous
  # setup also broke on every `make down + up` because the upstream
  # entrypoint re-runs `schematool -initSchema` unconditionally and the
  # preserved Postgres volume landed in `BUCKETING_COLS already exists`.
  # If you later need a real catalog (Glue / Unity Catalog / Polaris),
  # add it as a separate opt-in profile; do not bring this back here.

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark-runtime
    image: lake-spark:3.5.6
    container_name: lake-spark-master
    env_file:
      - .env
    environment:
      SPARK_MODE: master
      SPARK_MASTER: "spark://spark-master:7077"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_JAVA_OPTS: "-Dspark.deploy.mode=cluster"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_SECURE: "false"
      KAFKA_BOOTSTRAP: "kafka:29092"
      PYTHONPATH: /app-src/src
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"   # Spark master
      - "4040:4040"   # Spark app UI
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
      - ./configs/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark-runtime
    image: lake-spark:3.5.6
    container_name: lake-spark-worker
    env_file:
      - .env
    environment:
      SPARK_MODE: worker
      SPARK_MASTER: "spark://spark-master:7077"
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_SECURE: "false"
      KAFKA_BOOTSTRAP: "kafka:29092"
      PYTHONPATH: /app-src/src
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./src:/app-src/src:ro
      - ./data-samples:/data-samples:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://spark-master:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-db:
    image: postgres:13
    container_name: lake-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    # Custom image with lakehouse Python deps pre-installed.
    # Build with:  docker build -f Dockerfile.airflow -t lake-airflow:2.7.0 .
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: lake-airflow:2.7.0
    container_name: lake-airflow-webserver
    depends_on:
      airflow-db:
        condition: service_healthy
      # Wait until the webserver's own port is up (Airflow is ready to serve)
      # rather than just "container started", which finishes long before
      # `airflow db init` and gunicorn are ready.
    healthcheck:
      # We use the API root (which returns 302/200 redirect to the login
      # page) plus a `db check` round-trip — this proves Airflow is up
      # without creating a cyclic dependency on the scheduler (whose
      # heartbeat is part of /api/v1/health, but the scheduler is in turn
      # depends_on the webserver being healthy).
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8080/ | grep -qE '^(200|301|302)$' &&
          airflow db check >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      JAVA_HOME: /opt/java/openjdk
      PYTHONPATH: /app-src/src
      # Inside the compose network, MinIO is reachable as `minio:9000` (not
      # localhost:9000). The csv_ingestor task runs a local SparkSession in
      # the webserver container, so its s3a endpoint must resolve on the
      # compose network.
      # Note: when S3_ENDPOINT is set in .env (Cloudflare R2), the lakehouse
      # package reads S3_* and ignores MINIO_* — the values below are just
      # safe defaults that are overridden by env_file when R2 is active.
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      DATA_SAMPLES_DIR: /data-samples
    ports:
      - "8088:8080"  # Airflow webserver (host 8088 → container 8080, avoids Spark UI collision on 8080)
    volumes:
      - ./airflow_dags:/opt/airflow/dags:ro
      - ./src:/app-src/src:ro
      # Mount data-samples at /data-samples so retail_generator / csv_ingestor
      # can find CSVs regardless of which directory the BashOperator runs in.
      - ./data-samples:/data-samples
      - ./airflow_logs:/opt/airflow/logs
      # Mount Docker socket so DAG tasks can call `docker exec lake-spark-master spark-submit ...`
      # Note: `/usr/bin/docker` is already present in the base image, so we only need the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin;
      airflow webserver
      "

  airflow-scheduler:
    # Custom image with lakehouse Python deps pre-installed.
    # Build with:  docker build -f Dockerfile.airflow -t lake-airflow:2.7.0 .
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: lake-airflow:2.7.0
    container_name: lake-airflow-scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      JAVA_HOME: /opt/java/openjdk
      PYTHONPATH: /app-src/src
      # Same MinIO/Delta endpoint wiring as the webserver — the scheduler
      # is the one that *runs* task instances on LocalExecutor, so any
      # task that creates a local SparkSession (bronze_ingest) needs this.
      # When S3_ENDPOINT is set in .env, the lakehouse package switches to R2.
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      DATA_SAMPLES_DIR: /data-samples
    volumes:
      - ./airflow_dags:/opt/airflow/dags:ro
      # Mount source at /app-src/src; Spark entry-point scripts use this path.
      - ./src:/app-src/src:ro
      # data-samples mount (see comment on webserver service)
      - ./data-samples:/data-samples
      - ./airflow_logs:/opt/airflow/logs
      # Mount Docker socket so DAG tasks can call `docker exec lake-spark-master spark-submit ...`
      # Note: `/usr/bin/docker` is already present in the base image, so we only need the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  metabase:
    image: metabase/metabase:latest
    container_name: lake-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  mongo:
    image: mongo:7
    container_name: lake-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongoadmin
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lake-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Opt-in app layer is defined in docker-compose.dev-api.yml
  # Core stack:  docker compose -f docker-compose.yml -f docker-compose-kafka.yml up -d
  # Core + apps: docker compose -f docker-compose.yml -f docker-compose-kafka.yml -f docker-compose.dev-api.yml up -d

volumes:
  minio_data:
  postgres_data:
  airflow_db_data:
  metabase_data:
  mongo_data:
  redis_data:
