# Spark defaults
spark.master                     spark://spark-master:7077
spark.eventLog.enabled            true
spark.eventLog.dir                /tmp/spark-events
spark.jars.ivy                    /tmp/.ivy2
# Worker has 2 cores / 2g. Cap each app at 1 core so a long-running streaming
# job cannot starve batch jobs (otherwise: "Initial job has not accepted any resources").
spark.cores.max                   1
spark.serializer                  org.apache.spark.serializer.KryoSerializer
spark.sql.extensions              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog   org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.schema.autoMerge.enabled true
spark.databricks.delta.enableDeletionVectors true

# MinIO / S3A
#
# The endpoint MUST be a bare `host:port` — `s3a.endpoint` is not a URL.
# With `http://minio:9000` the S3A connector sends the scheme as part of
# the Host header and the broker answers:
#
#   org.apache.hadoop.fs.s3a.AWSBadRequestException: getFileStatus on
#   s3a://lakehouse/bronze/erp/products/_delta_log: ... Status Code: 400
#   Bad Request
#
# `s3a.connection.ssl.enabled` is the flag that decides HTTP vs HTTPS.
spark.hadoop.fs.s3a.endpoint      minio:9000
spark.hadoop.fs.s3a.access.key    minioadmin
spark.hadoop.fs.s3a.secret.key    minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.endpoint.region us-east-1
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.impl          org.apache.hadoop.fs.s3a.S3AFileSystem

# The worker has 2 cores / 2g of memory. A 2g executor plus the driver
# does not fit twice on the same worker, and the second executor is
# OOM-killed ("Command exited with code 137"). Cap the executor heap so a
# driver and its executor stay inside the budget.
spark.executor.memory             768m
spark.executor.cores              1
